# AI Incident Triage Agent configuration
server:
  port: 8081

spring:
  application:
    name: ai-incident-agent

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/incident_agent
    username: agent
    password: agent123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Spring AI - OpenAI configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
          max-tokens: 1000

# External service endpoints (overridden by env vars in Docker)
app:
  prometheus:
    url: ${PROMETHEUS_URL:http://localhost:9090}
  loki:
    url: ${LOKI_URL:http://localhost:3100}
  alertmanager:
    url: ${ALERTMANAGER_URL:http://localhost:9093}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true

# Logging
logging:
  level:
    com.example.agent: DEBUG
    org.springframework.ai: INFO
