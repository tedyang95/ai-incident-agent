# Prometheus configuration — scrapes metrics from the demo app
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rule files
rule_files:
  - "alert_rules.yml"

# Alertmanager endpoint
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape targets
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "demo-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["demo-app:8080"]
        labels:
          application: "demo-ecommerce"
          environment: "docker"

  - job_name: "agent-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["agent-app:8081"]
        labels:
          application: "ai-incident-agent"
          environment: "docker"
