# 告警规则 - 当这些条件满足时触发告警
groups:
  - name: demo-app-alerts
    rules:
      # 1. 服务宕机
      - alert: DemoAppDown
        expr: up{job="demo-app"} == 0
        for: 30s
        labels:
          severity: critical
          service: demo-app
          category: availability
        annotations:
          summary: "Demo App is down"
          description: "Demo App has been unreachable for more than 30 seconds."

      # 2. 高错误率（error rate > 10%）
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
          / sum(rate(http_server_requests_seconds_count[1m])) > 0.1
        for: 1m
        labels:
          severity: critical
          service: demo-app
          category: error-rate
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10% for more than 1 minute."

      # 3. 高延迟（p99 latency > 1s）
      - alert: HighLatency
        expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[1m])) by (le)) > 1
        for: 1m
        labels:
          severity: warning
          service: demo-app
          category: latency
        annotations:
          summary: "High p99 latency"
          description: "p99 request latency is above 1 second for more than 1 minute."

      # 4. JVM 堆内存使用率 > 85%（用 Old Gen，避免 G1 的 -1 动态区干扰）
      - alert: HighMemoryUsage
        expr: |
          jvm_memory_used_bytes{area="heap", id="G1 Old Gen"}
          / jvm_memory_max_bytes{area="heap", id="G1 Old Gen"} > 0.85
        for: 2m
        labels:
          severity: warning
          service: demo-app
          category: resource
        annotations:
          summary: "JVM heap memory usage high"
          description: "JVM heap memory usage is above 85% for more than 2 minutes."

      # 5. 数据库连接池耗尽
      - alert: ConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 1m
        labels:
          severity: critical
          service: demo-app
          category: resource
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "More than 90% of database connections are in use."
