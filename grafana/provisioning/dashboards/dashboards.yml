# Grafana dashboard auto-provisioning (as-code)
# Tells Grafana which directory holds the dashboard JSON files
apiVersion: 1

providers:
  - name: "incident-overview"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
