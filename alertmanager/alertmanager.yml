# Alertmanager configuration - routes alerts to the AI agent and notification channels
global:
  resolve_timeout: 5m

# Route tree: decides where each alert goes based on its labels
route:
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: "ai-agent-webhook"  # default receiver: the AI agent
  routes:
    # critical alerts also go to the AI agent (and, in the future, Slack)
    - matchers:
        - severity = "critical"
      receiver: "ai-agent-webhook"
      continue: true

# Receiver definitions
receivers:
  # Sends alerts to the AI agent via webhook
  - name: "ai-agent-webhook"
    webhook_configs:
      # Full-stack mode (end-to-end regression / demo): webhook points at the
      # agent-app container on the Docker network.
      # (Dev mode: when running agent-app from the IDE, switch back to
      #  http://host.docker.internal:8081/api/alert/webhook)
      - url: "http://agent-app:8081/api/alert/webhook"
        send_resolved: true
        max_alerts: 10

# Inhibition rules: a critical alert suppresses lower-severity alerts
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["service", "category"]
