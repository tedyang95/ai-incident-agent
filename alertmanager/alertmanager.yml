# Alertmanager 配置 - 路由告警到 AI Agent 和通知渠道
global:
  resolve_timeout: 5m

# 路由树：根据告警标签决定发给谁
route:
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: "ai-agent-webhook"  # 默认发给 AI Agent
  routes:
    # critical 级别同时发给 AI Agent 和（未来的）Slack
    - matchers:
        - severity = "critical"
      receiver: "ai-agent-webhook"
      continue: true

# 接收者定义
receivers:
  # 把告警通过 webhook 发给 AI Agent
  - name: "ai-agent-webhook"
    webhook_configs:
      # 全家桶模式（端到端回归/演示）：webhook 指向容器网络内的 agent-app
      # （开发模式：IDE 跑 agent-app 时改回 http://host.docker.internal:8081/api/alert/webhook）
      - url: "http://agent-app:8081/api/alert/webhook"
        send_resolved: true
        max_alerts: 10

# 抑制规则：高严重度告警触发时抑制低严重度
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["service", "category"]
